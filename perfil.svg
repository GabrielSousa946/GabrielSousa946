<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" width="1000" height="310" role="img" aria-labelledby="title description">
  <title id="title">Gabriel Sousa</title>
  <desc id="description">Desenvolvimento de sistemas, redes e automação. Uma agenda e uma lista de vagas representam CutBase e Job-Search.</desc>
  <defs>
    <linearGradient id="background" x2="100%" y2="90%">
      <stop stop-color="#11172C"/>
      <stop offset="1" stop-color="#111C33"/>
    </linearGradient>
    <radialGradient id="light">
      <stop stop-color="#413478" stop-opacity=".8"/>
      <stop offset="1" stop-color="#413478" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent">
      <stop stop-color="#A99AFF"/>
      <stop offset="1" stop-color="#73DFEA"/>
    </linearGradient>
    <pattern id="grid" width="27" height="27" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.3" fill="#91A0CA" opacity=".25"/>
    </pattern>
    <clipPath id="frame">
      <rect x="1" y="1" width="998" height="308" rx="25"/>
    </clipPath>
    <style>
      .cursor { animation: cursor 950ms 2; }
      .calendar { animation: arrive 800ms 120ms both; }
      .search { animation: arrive 800ms 330ms both; }
      .booking { animation: highlight 1150ms 600ms both; }
      .result { animation: grow 900ms 830ms both; transform-box: fill-box; transform-origin: left center; }
      @keyframes cursor { 0%, 100% { opacity: .85; } 50% { opacity: .28; } }
      @keyframes arrive { from { opacity: .25; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes highlight { from { opacity: .2; } to { opacity: 1; } }
      @keyframes grow { from { transform: scaleX(.2); } to { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) {
        .cursor, .calendar, .search, .booking, .result { animation: none; }
      }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1000" height="310" fill="url(#background)"/>
    <ellipse cx="830" cy="110" rx="395" ry="320" fill="url(#light)"/>
    <rect x="579" width="421" height="310" fill="url(#grid)"/>
    <path d="M596 229h47l22-25h126m-87-156h49l24 23h175M864 252h48l31-31h57" fill="none" stroke="#6576A8" stroke-opacity=".34" stroke-width="1.5"/>
    <circle cx="596" cy="229" r="3" fill="#9C8DF3"/>
    <circle cx="704" cy="48" r="3" fill="#7D94D3"/>
    <circle cx="864" cy="252" r="3" fill="#75D9E8"/>
    <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
      <g fill="#C3B6FF" font-family="ui-monospace, Consolas, monospace">
        <text x="55" y="88" font-size="23" font-weight="600">&gt; oi, eu sou</text>
        <rect class="cursor" x="220" y="69" width="11" height="22" rx="2" fill="#AD9BFF" opacity=".85"/>
      </g>
      <text x="51" y="163" fill="#F7F8FF" font-size="68" font-weight="750" letter-spacing="-2.2">Gabriel Sousa</text>
      <text x="55" y="213" fill="#C4CDEC" font-size="27">Desenvolvimento de sistemas</text>
      <text x="55" y="251" fill="#C4CDEC" font-size="27">Redes e automação</text>
      <rect x="55" y="271" width="85" height="4" rx="2" fill="url(#accent)"/>
      <g class="calendar">
        <rect x="629" y="64" width="219" height="129" rx="17" fill="#0C1428" stroke="#8D7EEA" stroke-opacity=".75"/>
        <rect x="648" y="82" width="21" height="19" rx="4" fill="none" stroke="#C2B4FF" stroke-width="2"/>
        <path d="M652 79v7m13-7v7m-16 2h19" stroke="#C2B4FF" stroke-width="2" stroke-linecap="round"/>
        <text x="680" y="98" font-size="17" font-weight="700" fill="#E2DAFF">CutBase</text>
        <path d="M648 111h181" stroke="#4C4775" stroke-opacity=".8"/>
        <rect x="649" y="125" width="36" height="16" rx="4" fill="#302750"/>
        <rect class="booking" x="694" y="125" width="36" height="16" rx="4" fill="#AA96FC"/>
        <rect x="739" y="125" width="36" height="16" rx="4" fill="#302750"/>
        <rect x="649" y="150" width="36" height="16" rx="4" fill="#302750"/>
        <rect x="694" y="150" width="36" height="16" rx="4" fill="#302750"/>
      </g>
      <g class="search">
        <rect x="748" y="152" width="205" height="117" rx="17" fill="#0A1C2D" stroke="#59C4D4" stroke-opacity=".82"/>
        <circle cx="775" cy="177" r="7" fill="none" stroke="#8AE9EF" stroke-width="2"/>
        <path d="m780 183 5 5" stroke="#8AE9EF" stroke-width="2" stroke-linecap="round"/>
        <text x="797" y="184" font-size="17" font-weight="700" fill="#CAF4F8">Job-Search</text>
        <path d="M765 197h170" stroke="#325666" stroke-opacity=".9"/>
        <rect x="766" y="212" width="168" height="6" rx="3" fill="#233F50"/>
        <rect class="result" x="766" y="212" width="135" height="6" rx="3" fill="#74DCE8"/>
        <rect x="766" y="232" width="103" height="6" rx="3" fill="#395B6E"/>
        <rect x="766" y="246" width="72" height="6" rx="3" fill="#395B6E"/>
      </g>
    </g>
  </g>
  <rect x="1" y="1" width="998" height="308" rx="25" fill="none" stroke="#6974AB" stroke-opacity=".55" stroke-width="2"/>
</svg>
